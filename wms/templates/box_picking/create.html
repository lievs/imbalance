{% extends "base.html" %}
{% block title %}Новое задание на подбор{% endblock %}
{% block content %}
<p><a href="{{ url_for('box_picking.list_tasks') }}">&larr; Задания на подбор</a></p>
<h3 class="mb-3">Новое задание на подбор коробов</h3>
<form method="post" enctype="multipart/form-data" class="card p-3" style="max-width:760px">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Склад</label>
      <select name="warehouse_id" class="form-select" required>
        <option value="">Выберите склад</option>
        {% for wh in warehouses %}<option value="{{ wh.id }}">{{ wh.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Склад назначения</label>
      <select name="to_warehouse_id" class="form-select" required>
        <option value="">Куда перемещаем</option>
        {% for wh in warehouses %}<option value="{{ wh.id }}">{{ wh.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Исполнитель</label>
      <select name="assigned_to_id" class="form-select">
        <option value="">Не назначен</option>
        {% for user in users %}<option value="{{ user.id }}">{{ user.display_name() }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-12">
      <label class="form-label">Название / комментарий</label>
      <input name="title" class="form-control" placeholder="Например: рейс на 25.11">
    </div>
    <div class="col-12">
      <label class="form-label">Номера коробов</label>
      <textarea name="box_codes" class="form-control" rows="8" placeholder="Отсканируйте или вставьте номера — по одному в строке"></textarea>
      <div class="form-text">Пустые короба без товара в задание не добавляются.</div>
    </div>
    <div class="col-12">
      <label class="form-label">Загрузить из Excel</label>
      <input type="file" name="file" class="form-control" accept=".xlsx">
      <div class="form-text"><a href="{{ url_for('box_picking.template') }}">Скачать шаблон задания</a></div>
    </div>
  </div>
  <div class="mt-3"><button class="btn btn-primary" type="submit">Создать задание</button></div>
</form>
{% endblock %}
